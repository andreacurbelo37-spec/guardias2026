<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVISUEL - Sistema de Guardias</title>
    <meta property="og:title" content="GUARDIAS COVISUEL">
    <meta property="og:description" content="Sistema de registro de turnos">
    <meta property="og:image" content="https://andreacurbelo37-spec.github.io/guardias2026/Covisuel%20logo%20para%20llavero.jpg">
    <meta property="og:url" content="https://andreacurbelo37-spec.github.io/guardias2026/">
    <style>    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Panel Izquierdo */
        .left-panel {
            width: 320px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo-container {
            text-align: center;
            padding: 10px;
        }

        .logo-container img {
            max-width: 120px;
            border-radius: 50%;
            border: 3px solid #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.3);
        }

        .app-title {
            text-align: center;
            font-size: 1.5em;
            color: #4facfe;
            margin-bottom: 10px;
        }

        .socio-selector {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .socio-selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #4facfe;
        }

        .socio-selector select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .contador-guardias {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }

        .contador-guardias.visible {
            display: block;
        }

        .contador-guardias h3 {
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .contador-items {
            display: flex;
            justify-content: space-around;
        }

        .contador-item {
            text-align: center;
        }

        .contador-item .numero {
            font-size: 2em;
            font-weight: bold;
        }

        .contador-item .label {
            font-size: 0.85em;
            opacity: 0.9;
        }

        /* Panel Principal */
        .main-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
        }

        .btn-excel {
            background: #217346;
            color: white;
        }

        .btn-compliance {
            background: #f39c12;
            color: white;
        }

        .btn-admin {
            background: #e74c3c;
            color: white;
        }

        .nav-buttons button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Navegación del Calendario */
        .calendar-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .calendar-nav button {
            background: #4facfe;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .calendar-nav button:hover {
            background: #3d8bd9;
        }

        .calendar-nav span {
            font-size: 1.3em;
            font-weight: bold;
            min-width: 200px;
            text-align: center;
        }

        /* Calendario */
        .calendar {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .calendar-header div {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            color: #4facfe;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
            min-height: 70px;
        }

        .calendar-day:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .calendar-day.empty {
            background: transparent;
            cursor: default;
        }

        .calendar-day.empty:hover {
            transform: none;
        }

        .calendar-day .day-number {
            font-size: 1.2em;
            font-weight: bold;
        }

        .calendar-day .turnos {
            display: flex;
            gap: 3px;
            margin-top: 5px;
        }

        .turno-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .turno-tarde { background: #f39c12; }
        .turno-noche { background: #3498db; }

        .turno-verde { background: #27ae60; }
        .turno-amarillo { background: #f1c40f; }
        .turno-rojo { background: #e74c3c; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #4facfe;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group select,

            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }

        .turno-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .turno-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        .turno-btn.tarde {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border-color: #f39c12;
        }

        .turno-btn.noche {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border-color: #3498db;
        }

        .turno-btn.selected {
            transform: scale(1.05);
        }

        .turno-btn.tarde.selected {
            background: #f39c12;
            color: white;
        }

        .turno-btn.noche.selected {
            background: #3498db;
            color: white;
        }

        .tipo-registro {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tipo-btn {
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tipo-btn:hover {
            border-color: #4facfe;
        }

        .tipo-btn.selected {
            background: #4facfe;
            border-color: #4facfe;
        }

        .campo-adicional {
            display: none;
            margin-top: 15px;
        }

        .campo-adicional.visible {
            display: block;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-confirmar {
            background: #27ae60;
            color: white;
        }

        .btn-cancelar {
            background: #e74c3c;
            color: white;
        }

        .btn-confirmar:hover, .btn-cancelar:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Registros del día */
        .registros-dia {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .registros-dia h4 {
            margin-bottom: 10px;
            color: #4facfe;
        }

        .registro-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .registro-info {
            display: flex;
            flex-direction: column;
        }

        .registro-turno {
            font-weight: bold;
        }

        .registro-turno.tarde { color: #f39c12; }
        .registro-turno.noche { color: #3498db; }

        .btn-eliminar {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Loading */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
            gap: 20px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: white;
            font-size: 1.1em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }

            .calendar-header div {
                font-size: 0.8em;
                padding: 5px;
            }

            .calendar-day {
                min-height: 50px;
            }

            .calendar-day .day-number {
                font-size: 1em;
            }

            .nav-buttons button {
                padding: 8px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>

    <!-- Modal de Registro -->

                <input type="password" id="adminPassword" placeholder="Ingrese contraseña">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModalAdmin()">Cancelar</button>
                <button class="btn-confirmar" onclick="verificarAdmin()">Ingresar</button>

           <div class="form-group">

                <select id="selectCicloDesbloquear" onchange="mostrarFechasCiclo()">

    <script>
        // ==================== CONFIGURACIÓN ====================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGQhMAnoQ8G-hbFINHpTOmX67KVUaLNW_LAV9D3aZ84x-fozpclZ_AuYYmX3OAQxYU/exec';
        
        // SOCIOS CORRECTOS DE COVISUEL
        const SOCIOS = [
            {id: 215, nombre: "Mary Yacqueline Cunha Gómez"},
            {id: 222, nombre: "Mariana Gissel Arias D'ottone"},
            {id: 223, nombre: "Claudia Erika Peña Mármol"},
            {id: 225, nombre: "Stephanie Arias"},
            {id: 228, nombre: "Eduardo Sequeira"},
            {id: 230, nombre: "Alejandra Cabrera"},
            {id: 236, nombre: "Jorge Almada"},
            {id: 237, nombre: "Gonzalo Correa"},
            {id: 238, nombre: "Pablo Mercadal"},
            {id: 239, nombre: "Verónica Echevarría"},
            {id: 240, nombre: "Andrea Curbelo"},
            {id: 241, nombre: "Washington Villar"},
            {id: 242, nombre: "Sabrina Aguilar"},
            {id: 243, nombre: "Soraya Buelmo"},
            {id: 244, nombre: "Marlon Goes"},
            {id: 245, nombre: "Virginia Diaz"},
            {id: 246, nombre: "Oscar Ibarra"},
            {id: 247, nombre: "Claudia Sequeira"},
            {id: 248, nombre: "Claudia Buelmo"},
            {id: 249, nombre: "Mayra Buelmo"},
            {id: 251, nombre: "Adriana Menéndez"},
            {id: 253, nombre: "Juan Pablo Gallulo"},
            {id: 254, nombre: "Belén González"},
            {id: 256, nombre: "Francesca Delgado"},
            {id: 257, nombre: "Juan Rosa"},
            {id: 258, nombre: "Florencia Muñoz"},
            {id: 259, nombre: "Jorge Coímbra"},
            {id: 261, nombre: "Roberto Martínez"},
            {id: 262, nombre: "Katherine Cheda"},
            {id: 265, nombre: "Kevin Guaraglia"},
            {id: 266, nombre: "María Noel Carbajal"},
            {id: 267, nombre: "Martin Saldivia"},
            {id: 268, nombre: "Maximiliano Cisnero"},
            {id: 269, nombre: "Claudia Rios"}
        ];

        const ADMINS = [240, 245, 253, 266];
        const ADMIN_PASSWORD = "Molas2026";

        // ==================== ESTADO ====================
        let currentMonth = 3;
        let currentYear = 2026;
        let selectedSocio = null;
        let selectedDate = null;
        let selectedTurno = null;
        let selectedTipo = 'titular';
        let guardias = [];
        let isAdmin = false;
        let cicloActivo = 1;
        let ciclosDesbloqueados = [];

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', function() {
            cargarSocios();
            cargarGuardias();
            cargarCicloActivo();
        });

        function cargarSocios() {
            const select = document.getElementById('socioSelect');
            SOCIOS.forEach(socio => {
                const option = document.createElement('option');
                option.value = socio.id;
                option.textContent = `${socio.id} - ${socio.nombre}`;
                select.appendChild(option);
            });
        }

        // ==================== API GOOGLE SHEETS ====================
        async function cargarGuardias() {
            showLoading(true);
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getGuardias`);
                const data = await response.json();
                guardias = data.guardias || [];
                renderCalendar();
                actualizarContador();
            } catch (error) {
                console.error('Error cargando guardias:', error);
                guardias = [];
                renderCalendar();
            }
            showLoading(false);
        }

        async function cargarCicloActivo() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getCicloActivo`);
                const data = await response.json();
                if (data.cicloActivo) {
                    cicloActivo = parseInt(data.cicloActivo);
                }
            } catch (error) {
                console.error('Error cargando ciclo activo:', error);
                cicloActivo = 1;
            }
        }

        function obtenerCiclo(fecha) {
            const fechaInicio = new Date('2026-05-01');
            const fechaGuardia = new Date(fecha);
            const diasTranscurridos = Math.floor((fechaGuardia - fechaInicio) / (1000 * 60 * 60 * 24));
            return Math.floor(diasTranscurridos / 34) + 1;
        }

        async function guardarGuardia(guardia) {
            showLoading(true);
            try {
                // Validar que la fecha pertenece al ciclo activo
                const cicloFecha = obtenerCiclo(guardia.fecha);
                if (cicloFecha !== cicloActivo && !ciclosDesbloqueados.includes(cicloFecha)) {
                    alert(`No se puede registrar. Solo está habilitado el Ciclo ${cicloActivo}.`);
                    showLoading(false);
                    return false;
                }
                
                const params = new URLSearchParams({
                   action: 'registrarGuardia',
                   fecha: guardia.fecha,
                   turno: guardia.turno,
                   odoo: guardia.socioId,
                   nombre: guardia.socioNombre,
                   tipo: guardia.tipo || 'Titular',
                   cubre: guardia.cubre || ''
});

                await fetch(`${SCRIPT_URL}?${params.toString()}`);
                await cargarGuardias();
                showLoading(false);
                return true;
            } catch (error) {
                console.error('Error guardando guardia:', error);
                alert('Error al guardar. Intente nuevamente.');

        async function eliminarGuardia(fecha, turno, socioId) {
            const autorizados = [
                'administrador',
                'admin',
                'andrea curbelo',
                'maria andrea curbelo',
                '240',
                'maria noel carbajal',
                'noel carbajal',
                '266',
                'virginia diaz',
                'virginia díaz',
                'juan pablo gallulo'
            ];
            const selectElement = document.getElementById('socioSelect');
            const socioActual = selectElement.value.toLowerCase(); 
            const textoSocio = selectElement.options[selectElement.selectedIndex].text.toLowerCase();

            const esAutorizado = autorizados.some(auth =>        
                socioActual.includes(auth.toLowerCase()) || 
                textoSocio.includes(auth.toLowerCase())
            );
            if (!esAutorizado) {
                alert('No tenes permiso para eliminar guardias.\n\nContacta a la administracion.');
                return;
            }
            
            if (!confirm('¿Eliminar este registro?')) return;
            
            showLoading(true);
            console.log('Enviando:', fecha, turno, socioId);
            
            try {
                const params = new URLSearchParams({
                    action: 'cancelarGuardia',
                    fecha: fecha,
                    turno: turno,
                    odoo: String(socioId)
                });
                
                const response = await fetch(`${SCRIPT_URL}?${params.toString()}`);
                const result = await response.json();
                console.log('Result:', result);
                
                if (result.success) {
                    await cargarGuardias();
                    mostrarRegistrosDelDia(fecha.substring(0,10));
                } else {
                    alert('Error al eliminar: ' + (result.error || 'Error desconocido'));
                }
            } catch (error) {
                console.error('Error eliminando guardia:', error);
                alert('Error al eliminar. Intente nuevamente.');
            }
            showLoading(false);
        }

        // ==================== CALENDARIO ====================
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const mesActual = document.getElementById('mesActual');
            
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            mesActual.textContent = `${meses[currentMonth]} ${currentYear}`;
            
            const primerDia = new Date(currentYear, currentMonth, 1);
            const ultimoDia = new Date(currentYear, currentMonth + 1, 0);
            const diasEnMes = ultimoDia.getDate();
            const diaInicio = primerDia.getDay();
            
            grid.innerHTML = '';
            
            for (let i = 0; i < diaInicio; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                grid.appendChild(emptyDay);
            }
            
            for (let dia = 1; dia <= diasEnMes; dia++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                const fechaStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                
                const guardiasDelDia = guardias.filter(g => g.fecha.substring(0,10) === fechaStr);
                const tardeCant = guardiasDelDia.filter(g => g.turno === 'tarde').length;
                const nocheCant = guardiasDelDia.filter(g => g.turno === 'noche').length;
                
                dayElement.innerHTML = `
                    <span class="day-number">${dia}</span>
                    <div class="turnos">
                        ${tardeCant > 0 ? `<span class="turno-indicator ${getColorClass(tardeCant)}" title="Tarde: ${tardeCant}/2">T${tardeCant}</span>` : ''}
                        ${nocheCant > 0 ? `<span class="turno-indicator ${getColorClass(nocheCant)}" style="background:#3498db" title="Noche: ${nocheCant}/3">N${nocheCant}</span>` : ''}
                    </div>
                `;
                
                dayElement.onclick = () => abrirModal(dia, fechaStr);
                grid.appendChild(dayElement);
            }

        async function confirmarRegistro() {
            if (!selectedTurno) {
                alert('⚠️ Seleccioná un turno (Tarde o Noche)');
                return;
            }
            
            const yaRegistrado = guardias.find(g => 
                g.fecha === selectedDate && 
                g.turno === selectedTurno && 
                g.odoo == selectedSocio.id
            );
            
            if (yaRegistrado) {
                alert('⚠️ Ya estás registrado en este turno');
                return;
            }
            
            const fechaInicioCiclos = new Date('2026-05-01');
            const fechaSeleccionada = new Date(selectedDate);
            const diasTranscurridos = Math.floor((fechaSeleccionada - fechaInicioCiclos) / (1000 * 60 * 60 * 24));
            const numeroCiclo = Math.floor(diasTranscurridos / 34);
            const inicioCicloActual = new Date(fechaInicioCiclos);
            inicioCicloActual.setDate(inicioCicloActual.getDate() + (numeroCiclo * 34));
            const finCicloActual = new Date(inicioCicloActual);
            finCicloActual.setDate(finCicloActual.getDate() + 33);
            
            const guardiasSocioCiclo = guardias.filter(g => {
                const fechaGuardia = new Date(g.fecha);
                return g.odoo == selectedSocio.id && 
                       fechaGuardia >= inicioCicloActual && 
                       fechaGuardia <= finCicloActual;
            });
            
            const tardesSocioCiclo = guardiasSocioCiclo.filter(g => g.turno === 'tarde').length;
            const nochesSocioCiclo = guardiasSocioCiclo.filter(g => g.turno === 'noche').length;
            
            if (selectedTurno === 'tarde' && tardesSocioCiclo >= 2) {
                alert('⚠️ Ya tenés 2 guardias TARDE en este ciclo de 34 días');
                return;
            }
            if (selectedTurno === 'noche' && nochesSocioCiclo >= 3) {
                alert('⚠️ Ya tenés 3 guardias NOCHE en este ciclo de 34 días');
                return;
            }

            const guardiasDelDia = guardias.filter(g =>
                g.fecha.substring(0, 10) === selectedDate &&
                g.turno === selectedTurno
            );
            
            const limiteDiario = selectedTurno === 'tarde' ? 2 : 3;
            if (guardiasDelDia.length >= limiteDiario) {
                alert(`⚠️ Ya hay ${limiteDiario} personas en ${selectedTurno.toUpperCase()} para este día`);
                return;
            }
            
            let tipo = 'Titular';
            let cubre = '';
            
            if (selectedTipo === 'Me Cubre') {
                const nombreMeCubre = document.getElementById('inputMeCubre').value.trim();
                if (!nombreMeCubre) {
                    alert('⚠️ Ingresá el nombre del Me Cubre');
                    return;
                }
                tipo = 'Me Cubre';
                cubre = nombreMeCubre;
            } else if (selectedTipo === 'nucleo') {
                const nombreFamiliar = document.getElementById('inputNucleo').value.trim();
                if (!nombreFamiliar) {
                    alert('⚠️ Ingresá el nombre del familiar');
                    return;
                }
                tipo = 'Núcleo';
                cubre = nombreFamiliar;
            }
            
            const guardia = {
                fecha: selectedDate,
                turno: selectedTurno,
                socioId: selectedSocio.id,
                socioNombre: selectedSocio.nombre,
                tipo: tipo,
                cubre: cubre
            };
            
            const resultado = await guardarGuardia(guardia);
            if (resultado === true) {
                cerrarModal();
                alert('✅ Guardia registrada correctamente');
            }
        }

        // ==================== EXPORTAR ====================
        function exportarWhatsApp() {
            const fechaInicioCiclos = new Date('2026-05-01');
            const fechaFinSistema = new Date('2027-12-31');
            const ciclos = [];
            
            let inicioActual = new Date(fechaInicioCiclos);
            let numCiclo = 1;
            
            while (inicioActual <= fechaFinSistema) {
                const finCiclo = new Date(inicioActual);
                finCiclo.setDate(finCiclo.getDate() + 33);
                
                ciclos.push({
                    numero: numCiclo,
                    inicio: new Date(inicioActual),
                    fin: new Date(finCiclo)
                });
                
                inicioActual.setDate(inicioActual.getDate() + 34);
                numCiclo++;
            }
            
            const nombresMeses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            
            let opcionesCiclos = ciclos.map(c => {
                const inicioStr = c.inicio.getDate() + '/' + nombresMeses[c.inicio.getMonth()] + '/' + c.inicio.getFullYear();
                const finStr = c.fin.getDate() + '/' + nombresMeses[c.fin.getMonth()] + '/' + c.fin.getFullYear();
                return `Ciclo ${c.numero}: ${inicioStr} - ${finStr}`;
            }).join('\n');
            
            const seleccion = prompt('Seleccioná el número de ciclo a exportar:\n\n' + opcionesCiclos + '\n\nEscribí el número de ciclo:');
            
            if (!seleccion) return;
            
            const cicloSeleccionado = parseInt(seleccion);
            if (isNaN(cicloSeleccionado) || cicloSeleccionado < 1 || cicloSeleccionado > ciclos.length) {
                alert('Número de ciclo inválido');
                return;
            }
            
            const ciclo = ciclos[cicloSeleccionado - 1];
            
            const guardiasDelCiclo = guardias.filter(g => {
                const fecha = new Date(g.fecha);
                return fecha >= ciclo.inicio && fecha <= ciclo.fin;
            }).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            
            const inicioTitulo = ciclo.inicio.getDate() + '/' + (ciclo.inicio.getMonth() + 1) + '/' + ciclo.inicio.getFullYear();
            const finTitulo = ciclo.fin.getDate() + '/' + (ciclo.fin.getMonth() + 1) + '/' + ciclo.fin.getFullYear();
            
            let mensaje = '*GUARDIAS COVISUEL*\n' + 'Ciclo ' + cicloSeleccionado + ': ' + inicioTitulo + ' al ' + finTitulo + '\n\n';
            
            if (guardiasDelCiclo.length === 0) {
                mensaje += 'No hay guardias registradas en este ciclo.';
            } else {
                let fechaAnterior = '';
                guardiasDelCiclo.forEach(g => {
                    const fecha = new Date(g.fecha);
                    const fechaStr = fecha.getDate() + '/' + (fecha.getMonth() + 1);
                    
                    if (fechaStr !== fechaAnterior) {
                        mensaje += '\n*' + fechaStr + '*\n';
                        fechaAnterior = fechaStr;
                    }
                    
                    const turnoTexto = g.turno.toUpperCase() === 'TARDE' ? 'TARDE' : 'NOCHE';
                    mensaje += '- ' + turnoTexto + ': ' + g.nombre + (g.cubre ? ' (Me Cubre: ' + g.cubre + ')' : '') + '\n';
                });
            }
            
            const url = 'https://wa.me/?text=' + encodeURIComponent(mensaje);
            window.open(url, '_blank');
        }

        finCiclo.setDate(finCiclo.getDate() + 33);
        
        // Filtrar guardias del ciclo
        guardiasAExportar = guardias.filter(g => {
            const fechaGuardia = new Date(g.fecha);
            return fechaGuardia >= inicioCiclo && fechaGuardia <= finCiclo;
        });

            const anioActual = currentYear;
            const fechaInicioCiclos = new Date('2026-05-01');
            const primerDiaMes = new Date(anioActual, mesActual, 1);
            
            const diasTranscurridos = Math.floor((primerDiaMes - fechaInicioCiclos) / (1000 * 60 * 60 * 24));
            const numeroCiclo = Math.floor(diasTranscurridos / 34);
            const inicioCicloActual = new Date(fechaInicioCiclos);
            inicioCicloActual.setDate(inicioCicloActual.getDate() + (numeroCiclo * 34));
            const finCicloActual = new Date(inicioCicloActual);
            finCicloActual.setDate(finCicloActual.getDate() + 33);
            
            const fechaInicioStr = inicioCicloActual.toLocaleDateString('es-UY');
            const fechaFinStr = finCicloActual.toLocaleDateString('es-UY');
            
            const guardiasCiclo = guardias.filter(g => {
                const fecha = new Date(g.fecha);
                return fecha >= inicioCicloActual && fecha <= finCicloActual;
            });
            
            let reporte = 'Ciclo: ' + fechaInicioStr + ' al ' + fechaFinStr + '\n\n';
            let cumplidos = 0;
            let pendientes = 0;
            
            SOCIOS.forEach(socio => {
                const guardiasSocio = guardiasCiclo.filter(g => g.odoo == socio.id);
                const tarde = guardiasSocio.filter(g => g.turno.toLowerCase() === 'tarde').length;
                const noche = guardiasSocio.filter(g => g.turno.toLowerCase() === 'noche').length;
                
                const cumpleTarde = tarde >= 2;
                const cumpleNoche = noche >= 3;
                
                if (cumpleTarde && cumpleNoche) {
                    cumplidos++;
                } else {
                    pendientes++;
                }
                
                const estadoTarde = cumpleTarde ? '✅' : '❌';
                const estadoNoche = cumpleNoche ? '✅' : '❌';
                
                reporte += '• ' + socio.nombre + '\n T:' + estadoTarde + ' ' + tarde + '/2  N:' + estadoNoche + ' ' + noche + '/3\n\n';
            });
            
            reporte = '✅ Cumplidos: ' + cumplidos + '/' + SOCIOS.length + '\n❌ Pendientes: ' + pendientes + '\n\n' + reporte;
            
            let modalDiv = document.createElement('div');
            modalDiv.id = 'modalCumplimiento';
            modalDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;';
            modalDiv.innerHTML = '<div style="background:white;padding:20px;border-radius:10px;max-width:90%;max-height:80%;overflow-y:auto;color:black;"><h3 style="color:black;">Cumplimiento por Ciclo</h3><pre style="font-size:12px;color:black;">' + reporte + '</pre><button id="btnCerrarModal" style="margin-top:10px;padding:10px 20px;cursor:pointer;">Cerrar</button></div>';
            document.body.appendChild(modalDiv);
            document.getElementById('btnCerrarModal').onclick = function() { modalDiv.remove(); };
        }
    </script>
</body>
</html>
